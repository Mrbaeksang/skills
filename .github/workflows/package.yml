name: Package
on: [push, pull_request]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package.py check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py check-bundle --dest plugins/skills
      - run: git diff --check
