<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build UI smoke fixture</title>
<style>
body { max-width: 36rem; margin: 3rem auto; font: 18px system-ui; padding: 1rem; }
input, button { font: inherit; padding: .5rem; }
[role=alert] { color: #a31515; min-height: 1.5em; }
</style>
<h1>Local greeting</h1>
<p>Disposable, in-memory fixture. No account or external service.</p>
<form novalidate>
  <label for="name">Name</label>
  <input id="name" autocomplete="off">
  <button>Greet</button>
</form>
<p role="alert" id="error"></p>
<p role="status" id="result">No greeting yet.</p>
<script>
document.querySelector('form').addEventListener('submit', event => {
  event.preventDefault();
  const name = document.querySelector('#name').value.trim();
  if (!name) {
    document.querySelector('#error').textContent = 'Enter a name.';
    return;
  }
  document.querySelector('#error').textContent = '';
  document.querySelector('#result').textContent = `Hello, ${name}!`;
});
</script>
</html>
