<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>브랜드 스타일 보존 예시</title>
<style>
body {margin:0;background:#faf9ff;color:#20213e;font:16px/1.6 system-ui,sans-serif}
main {max-width:680px;margin:auto;padding:20px}
header {background:linear-gradient(125deg,#6932d5,#4738c9);color:white;border-radius:14px;padding:24px}
h1 {margin:0;font-size:26px}
.categories {display:flex;gap:12px;flex-wrap:wrap;list-style:none;padding:0}
.categories li {background:#eee8fc;padding:8px 12px;border-radius:8px}
article {background:white;border:1px solid #d6d0ed;padding:16px;border-radius:10px;margin:12px 0}
article h2 {font-size:18px;margin:0}
article p {margin:4px 0;color:#48445f}
</style>
</head>
<body><main>
<header><h1>동네 모임</h1><p>브랜드 가이드: 보라색 그라데이션은 브랜드 자산입니다.</p></header>
<ul class="categories" aria-label="카테고리"><li>🍞 맛집</li><li>🚲 동네생활</li><li>📦 중고거래</li></ul>
<section aria-label="최근 이야기">
<article><h2>이번 주말 동네 자전거 모임</h2><p>동네생활 · 2시간 전</p></article>
<article><h2>새로 생긴 빵집 추천</h2><p>맛집 · 5시간 전</p></article>
</section>
</main></body>
</html>
