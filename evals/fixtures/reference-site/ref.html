<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>참고 서비스 · 도서관 도우미</title>
<style>
:root{--surface:#f6f7f9;--ink:#191f28;--ink-2:#4e5968;--ink-3:#8b95a1;--accent:#3182f6;--line:#e5e8eb;--r:14px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:400 17px/1.47 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;letter-spacing:-0.022em}
header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);padding:14px 20px;font-weight:700;font-size:19px}
main{padding:8px 20px 120px;max-width:560px;margin:0 auto}
.q{align-self:flex-end;margin:18px 0 10px auto;width:fit-content;max-width:78%;background:var(--surface);padding:10px 14px;border-radius:var(--r);font-size:16px}
.a{font-size:17px;line-height:1.6;white-space:pre-wrap}
.a span{opacity:0;transform:translateY(2px);display:inline;transition:opacity .18s var(--ease),transform .18s var(--ease)}
.a span.in{opacity:1;transform:none}
.meta{margin-top:10px;font-size:13px;color:var(--ink-3)}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--accent);vertical-align:-0.15em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.composer{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.composer div{display:flex;gap:8px;max-width:560px;margin:0 auto}
input{flex:1;border:0;background:var(--surface);border-radius:999px;padding:12px 16px;font:inherit;font-size:16px}
button{border:0;border-radius:999px;background:var(--accent);color:#fff;font:600 16px/1 inherit;padding:0 18px;transition:transform .12s var(--ease)}button:active{transform:scale(.96)}
</style></head><body>
<header>도서관 도우미</header>
<main><div class="q">이번 주 반납할 책 있어?</div><div class="a" id="a"></div><div class="meta" id="m"></div></main>
<div class="composer"><div><input placeholder="질문을 입력하세요" aria-label="질문"><button>보내기</button></div></div>
<script>
const a=document.getElementById('a'),m=document.getElementById('m'),caret=document.createElement('i');caret.className='caret';a.append(caret);
const es=new EventSource('/ref/stream');
es.addEventListener('delta',e=>{const d=JSON.parse(e.data);const s=document.createElement('span');s.textContent=d.t;caret.before(s);requestAnimationFrame(()=>s.classList.add('in'))});
es.addEventListener('done',e=>{caret.remove();m.textContent='답변 완료';es.close()});
</script></body></html>
